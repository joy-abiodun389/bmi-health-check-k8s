name: Teardown

# Manual-only. Removes the app from the cluster and optionally deletes the
# ECR images, so the project stops costing anything.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: ''
      delete_images:
        description: 'Also delete all images in ECR'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER: etechapp-eks-4QAQxDD3
  ECR_REPOSITORY: bmi-health-check-api
  K8S_NAMESPACE: bmi-api

jobs:
  teardown:
    name: Remove workloads
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation text did not match DESTROY. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Delete Kubernetes resources
        run: |
          kubectl kustomize k8s/base \
            | sed "s|__IMAGE__|placeholder|g" \
            | kubectl delete --ignore-not-found=true -f -
          kubectl -n "$K8S_NAMESPACE" get all || true

      - name: Delete ECR images
        if: inputs.delete_images
        run: |
          set -euo pipefail
          IDS=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --query 'imageIds[*]' --output json)
          if [ "$IDS" = "[]" ]; then
            echo "No images to delete"
          else
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
              --image-ids "$IDS" --query 'imageIds[].imageDigest' --output text
          fi
