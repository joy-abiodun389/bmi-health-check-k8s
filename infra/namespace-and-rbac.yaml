---
apiVersion: v1
kind: Namespace
metadata:
  name: bmi-api
  labels:
    app.kubernetes.io/part-of: bmi-health-check
---
# Least-privilege deploy rights for the GitHub Actions IAM role, which is
# mapped to the "bmi-api-deployers" group in the aws-auth ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bmi-api-deployer
  namespace: bmi-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # The database StatefulSet ships with the app manifests. Delete is withheld
  # so a bad apply can never drop the clients table's volume.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Smoke tests run inside the app pod instead of scheduling an extra pod.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bmi-api-deployer
  namespace: bmi-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bmi-api-deployer
subjects:
  - kind: Group
    name: bmi-api-deployers
    apiGroup: rbac.authorization.k8s.io
