apiVersion: v1
kind: Service
metadata:
  name: bmi-db
  labels:
    app.kubernetes.io/name: bmi-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: bmi-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bmi-db
  labels:
    app.kubernetes.io/name: bmi-db
spec:
  serviceName: bmi-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bmi-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bmi-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: bmi-db-credentials
          env:
            # The data directory must be a subdirectory of the mount so
            # initdb does not trip over the volume's lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 2Gi
