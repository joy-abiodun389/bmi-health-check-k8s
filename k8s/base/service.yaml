apiVersion: v1
kind: Service
metadata:
  name: bmi-api
  labels:
    app.kubernetes.io/name: bmi-api
spec:
  # ClusterIP keeps this free of load balancer charges. Use the
  # k8s/overlays/public overlay to expose it on an NLB instead.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bmi-api
  ports:
    - name: http
      port: 80
      targetPort: http
